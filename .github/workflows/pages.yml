# Demo pública no GitHub Pages: fixture sintético → check-data → build → deploy.
# NUNCA usa dados reais: scripts/make-demo-data.ts gera devs "Ana"/"Beto" e
# commits fictícios (e se recusa a sobrescrever public/data/ existente em
# máquina de dev). O check-data roda aqui para validar shape + invariantes do
# fixture antes de servir.
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions pinadas por SHA (higiene de supply chain — repo público);
      # a versão correspondente fica no comentário de cada linha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # lê o campo packageManager do package.json (corepack/pin do pnpm)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # node:sqlite sem flag desde a 22.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # fixture 100% sintético + validação de shape/invariantes
      - run: pnpm exec tsx scripts/make-demo-data.ts
      - run: pnpm check:data

      # a base do site vem do próprio Pages (raiz em user page, /gitview/ em
      # project page) — o router usa import.meta.env.BASE_URL para casar
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        id: pages

      - run: pnpm exec vite build --base "${{ steps.pages.outputs.base_path }}/"

      # fallback de SPA: deep links (/devs/Ana etc.) servem o index.html
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
