# Gates da org em CI: pnpm lint → pnpm typecheck → pnpm build, em PR e push
# em main. O check:data fica FORA de propósito: ele valida os JSONs de
# public/data/ (gitignored), que só existem depois de uma coleta com token —
# o CI não coleta e não deve precisar de segredo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions pinadas por SHA (higiene de supply chain — repo público);
      # a versão correspondente fica no comentário de cada linha
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # lê o campo packageManager do package.json (corepack/pin do pnpm)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # node:sqlite sem flag desde a 22.13
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
