# Policy de supply chain explícita (default do pnpm ≥ 11 é 1440; pinada porque
# config global de máquina pode zerar e o CI/CI local divergiriam): só instala
# pacote publicado há ≥ 24h. Bump novo que falhar com
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION é esperado — esperar amadurecer
# ou listar em minimumReleaseAgeExclude.
minimumReleaseAge: 1440
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - .
  - docs

overrides:
  esbuild: ^0.28.2
  # katex é transitiva de micromark-extension-math (@eslint/markdown do eslint
  # config), que pinna ^0.16.0 — advisory exige >= 0.18.2 e o Dependabot falhava
  # com security_update_not_possible (issue #20). katex só é chamada pelo renderer
  # HTML opcional (lib/html.js), que o lint de markdown não usa.
  katex: ^0.18.2

allowBuilds:
  esbuild: true
  vue-demi: true
